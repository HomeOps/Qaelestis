substitutions:
  name: master-bedroom-panel
  ip: 192.168.81.21
  friendly_name: Master Bedroom Panel  
  alarm_entity_id: alarm_control_panel.home_alarm
  cover_entity_id: cover.master_bedroom_blinds
  thermostat_entity_id: climate.master_bedroom

  nav_page_1: alarm_page
  nav_page_2: cover_page
  nav_page_3: thermostat_page
  nav_page_count: "3"
  sleep_mode_default_state: "ON"
  sleep_mode_default_timeout: "30"
  flash_size: "16MB"

esp32_ble_tracker:
bluetooth_proxy:
  active: true

packages:
  keypad:
    url: https://github.com/HomeOps/esphome-hass-panels
    ref: v2.1.1
    file: esp32-hass-panel.yaml
    refresh: 0d

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: ${ip}
    gateway: 192.168.81.1
    subnet: 255.255.255.0
