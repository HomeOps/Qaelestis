substitutions:
  # ── Tank geometry — 5000 L Ecotank "Estándar Tricapa" ────────────────
  # tank_height_m:   sensor-face-to-tank-FLOOR distance, in metres — the
  #   reading you would see with the tank bone dry. The 5000 L Ecotank
  #   tricapa body is ~2.0 m tall, so 2.00 is the starting estimate.
  #   *** MEASURE STRAIGHT DOWN AND CORRECT AFTER MOUNTING *** — the % and
  #   litres readings are only as accurate as this single number.
  # tank_capacity_l: rated capacity in litres (5000 L model). The tank is
  #   a vertical cylinder, so volume scales linearly with water depth.
  tank_height_m: "2.00"
  tank_capacity_l: "5000"
  tank_full_distance_m: "0.200"

  # ── Fault-detection thresholds, in metres — TUNE AFTER INSTALL ───────
  # overflow_distance_m: if the water surface comes closer than this to
  #   the sensor, the tank is overfull / overflowing (or the sensor has
  #   dropped onto something). Set just inside the safe maximum level.
  # no_target_distance_m: if the distance exceeds this, the sensor sees
  #   no target — knocked askew, fallen off, or water below sensing range.
  #   For a ~2 m tank the water can never read past the floor (~2.0 m),
  #   so anything beyond ~2.5 m can only be a fault. This sits just past
  #   empty, far below the sensor's 6.5 m "no target detected" code.
  overflow_distance_m: "0.15"
  no_target_distance_m: "2.50"

  # low_water_distance_m: NEW. Threshold for the UNGATED low-water alarm
  #   below. 1.55 m ≈ 25 % full. *** Align this with whatever
  #   alert.water_tank_low already uses, or the two will disagree. ***
  low_water_distance_m: "1.55"

  # ── Filter constant — the window order statistic ────────────────────
  # filter_quantile: 0.50 (median). Used by BOTH tank_distance and
  # tank_distance_fast. See water-tank-sensor-echo-remediation.md §9/§11.
  #
  # *** READ THIS before changing it back to 0.05. ***
  # The 0.05 low-tail filter (chosen 2026-07-26..31) is correct ONLY while
  # the tank is FULL. Its premise — "secondary echoes are always LONGER
  # than the water surface, so the truth lives in the low tail" — INVERTS
  # the moment the water drops below the fixed off-axis wall reflectors
  # (~0.5-1.0 m; doc §9.1 / §11.1b "largest-target" behaviour). With the
  # tank empty the true floor echo is ~2.0 m (the LONG mode) and the wall
  # reflections become the SHORT contamination, so q=0.05 latches onto a
  # ~2 % minority of 0.2-0.4 m false echoes and reports ~95-100 % full on a
  # bone-empty tank — then the old jump gate held that false-full for hours.
  #
  # MEASURED 2026-10-31 over 467,882 raw samples, 2026-10-26..31, a week the
  # tank was empty throughout (raw distance median 2.05 m, 95 % of samples
  # 1.4-2.6 m, tank floor ~2.0 m):
  #   q=0.05 + jump gate (as flashed): reported >80 % full 74 % of the time,
  #                                    0 % correctly empty  <- the fault
  #   q=0.50 median:                   empty 81 % of the time, 1.6 % false-full
  # The median also fails SAFE: on a genuinely full tank (where the long
  # reflections are the majority) it UNDER-reports and triggers a refill —
  # it never over-reports an empty tank into a dry delivery, which is the
  # failure that broke water delivery.
  #
  # The honest limit: NO fixed quantile is right in both regimes (doc §8.2,
  # §11). The real fix is the stilling well (§11.2) or a trusted hydrostatic
  # level. Until then the median is the safe compromise, biased toward the
  # empty case because that is the one that fails dangerously.
  filter_quantile: "0.50"

esphome:
  name: water-tank-sensor
  friendly_name: Water Tank Sensor

esp32:
  board: m5stack-atom
  framework:
    type: arduino

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Static IP, matching the CR house convention (see panels/panel.yaml and
  # midea_xye/midea_xye.yaml: same gateway/subnet, no dns1). Added
  # 2026-10-31. mDNS (water-tank-sensor.local) does not cross the WA<->CR
  # link, so the dedicated CR esp-builder must reach this device by a fixed
  # IP. .81.229 is the reserved address HA's ESPHome integration already
  # uses; gateway .81.1 confirmed from the HA host's ARP table (end0.81).
  manual_ip:
    static_ip: 192.168.81.229
    gateway: 192.168.81.1
    subnet: 255.255.255.0
  ap:
    ssid: !secret ap_ssid
    password: !secret ap_password

captive_portal:

# MB7851-B36 (XL-TankSensor-WRMT) serial build — see calestis-water-level-sensor.md.
#
# Pin order confirmed by multimeter: with the engraved "MB7851-B36" label
# reading right-side up, pins run 1..7 left to right (Pin 7 = rightmost).
# Wire into the M5 Atom Lite bottom 5-pin header (NOT the Grove port):
#
#   Sensor Pin 5  TX  (3rd from right) -> M5 header  G33   (ESP32 UART RX)
#   Sensor Pin 6  V+  (2nd from right) -> M5 header  3V3   (3.3 V — NOT 5 V)
#   Sensor Pin 7  GND (rightmost)      -> M5 header  GND
#
# 3.3 V supply keeps the sensor's TX line at 0–3.3 V, safe for GPIO33.
# Pin 4 (RX/trigger) left open -> sensor free-runs and auto-transmits.
#
# Frame format: the WRMT variant emits "Rnnnn Tnnn\r" — a distance field
# (mm) and a TEACH-CONFIDENCE field (not temperature; the MB7851 emits no
# temperature over serial). ESPHome's hrxl_maxsonar_wr only parses the
# plain "Rnnnn\r" frame, so that component is NOT used. The frame is
# parsed below: the UART debug feature splits the stream on CR and the
# lambda reads the 4 distance digits and publishes them (in metres) to
# 'tank_distance_raw' (unfiltered) and 'tank_distance' (filtered).
uart:
  id: maxbotix_uart
  rx_pin: GPIO33
  baud_rate: 9600
  debug:
    direction: RX
    dummy_receiver: true        # no other component reads this UART
    after:
      delimiter: "\r"           # one full frame per sequence call
    sequence:
      - lambda: |-
          // WRMT frame: 'R' + 4 distance digits + ' ' + 'T' + 3 confidence digits + CR.
          // Reject ONLY structurally-corrupt frames (line noise). EVERY
          // well-formed reading is published — including out-of-tank values
          // such as ~50 mm (water/object at the sensor) or ~6500 mm (no
          // target). Those are real fault signals — overflow, a displaced
          // or fallen sensor — and must never be filtered away or they
          // would freeze 'tank_distance' and disguise a fault as normal.
          if (bytes.size() < 5 || bytes[0] != 'R')
            return;
          int mm = 0;
          for (int i = 1; i <= 4; i++) {
            if (bytes[i] < '0' || bytes[i] > '9')
              return;
            mm = mm * 10 + (bytes[i] - '0');
          }
          float m = mm / 1000.0f;
          id(tank_distance_raw).publish_state(m);
          id(tank_distance).publish_state(m);
          id(tank_distance_fast).publish_state(m);

          // Optional teach-confidence field: ' ' 'T' + 3 digits (0-100).
          // NOT temperature — the MB7851 emits no temperature over serial;
          // the ambient-temp field exists only on the MB7853/MB7854.
          // Parsed AFTER the distance is already published, so a missing or
          // malformed field can never cost us a range reading.
          if (bytes.size() < 10 || bytes[5] != ' ' || bytes[6] != 'T')
            return;
          int t = 0;
          for (int i = 7; i <= 9; i++) {
            if (bytes[i] < '0' || bytes[i] > '9')
              return;
            t = t * 10 + (bytes[i] - '0');
          }
          id(sensor_teach_confidence).publish_state(t);

sensor:
  # UNFILTERED distance, one state per frame. Exists so the sensor's real
  # behaviour — spikes, dropouts, drift — is recorded for later analysis.
  # Never add a filter here; filter 'tank_distance'.
  - platform: template
    name: "Tank Distance Raw"
    id: tank_distance_raw
    unit_of_measurement: "m"
    device_class: distance
    accuracy_decimals: 3
    state_class: measurement
    entity_category: diagnostic

  # Teach confidence from the frame's 'Tnnn' field — 0-100, the sensor's
  # own confidence in its stored empty-tank calibration.
  #
  # *** DO NOT GATE READINGS ON THIS. *** MaxBotix says retrain below 75,
  # which invites using it as a quality signal. Measured over 5 days it is
  # the WRONG WAY ROUND: buckets at T=0-1 averaged 3.3 distance modes and
  # 0.62 clean-fraction, while T=20-100 averaged 4.3 modes and 0.50. The
  # cleanest ten hours of the week (single mode, 100 % clean, ±2 mm) ran at
  # T=0 throughout. T=0 is the resting state, not a fault; the 0->100 ramps
  # are re-teach cycles that fire AFTER the level moves. Gating on high
  # confidence would discard the best data. Diagnostic only.
  - platform: template
    name: "Sensor Teach Confidence"
    id: sensor_teach_confidence
    unit_of_measurement: "%"
    icon: "mdi:tune-vertical"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic

  # PRIMARY filtered distance. Everything user-facing (%, litres) reads
  # this one.
  - platform: template
    name: "Tank Distance"
    id: tank_distance
    unit_of_measurement: "m"
    device_class: distance
    accuracy_decimals: 3
    state_class: measurement
    filters:
      # Median over ~60 s — the ONLY defence now. The asymmetric jump gate
      # that used to follow this was REMOVED 2026-10-31 because it was the
      # direct cause of the reported 0->100 jumping on an empty tank:
      #
      #   The gate accepted any DOWNWARD move (shorter distance) instantly,
      #   on the premise that a shorter reading can only be the true echo
      #   returning or the tank filling. With the tank EMPTY that premise is
      #   false — the short readings ARE the wall reflections — so the gate
      #   snapped to the false-full value and then HELD it (gating the real
      #   upward correction) until the 6 h resync fired, producing exactly
      #   the full<->empty oscillation that was reported.
      #
      # A median needs >50 % of the 120-sample window to move before it
      # shifts, so it rejects the ~2 % short-echo minority on its own, in
      # both directions, with no gate. See the filter_quantile note above
      # and echo-remediation doc §9/§11 for why a gate cannot be made to
      # work across both the full and empty regimes.
      - quantile:
          window_size: 120      # ~60 s at the measured ~2 Hz frame rate
          send_every: 20        # publish every ~10 s
          send_first_at: 20
          quantile: ${filter_quantile}

  # Faster-responding level for the low-water alarm: a shorter window than
  # 'tank_distance' so a genuine fast drain is not delayed. Same median
  # estimator. Noisier than 'tank_distance' on purpose — the alarm's
  # delayed_on is what suppresses the noise, not a filter.
  - platform: template
    name: "Tank Distance Fast"
    id: tank_distance_fast
    unit_of_measurement: "m"
    device_class: distance
    accuracy_decimals: 3
    state_class: measurement
    entity_category: diagnostic
    filters:
      - quantile:
          window_size: 60
          send_every: 20
          send_first_at: 20
          quantile: ${filter_quantile}

  # Tank fill percentage. Depth = tank_height_m - measured distance.
  - platform: template
    name: "Water Tank Level"
    unit_of_measurement: "%"
    icon: "mdi:water-percent"
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 10s
    lambda: |-
      if (isnan(id(tank_distance).state)) return NAN;
      float depth_m = ${tank_height_m}f - id(tank_distance).state;
      return clamp(depth_m / (${tank_height_m}f - ${tank_full_distance_m}f) * 100.0f, 0.0f, 100.0f);

  # Stored volume in litres — water depth scaled by the tank capacity
  # (vertical cylinder, so depth and volume are linearly proportional).
  - platform: template
    name: "Water Tank Volume"
    unit_of_measurement: "L"
    icon: "mdi:water"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 10s
    lambda: |-
      if (isnan(id(tank_distance).state)) return NAN;
      float depth_m = ${tank_height_m}f - id(tank_distance).state;
      float full_l  = ${tank_capacity_l}.0f;
      return clamp(depth_m / ${tank_height_m}f * full_l, 0.0f, full_l);

  # Wi-Fi signal strength (RSSI). Useful for judging how much the
  # enclosure attenuates Wi-Fi — target better than -70 dBm; -80 dBm
  # or worse means dropped readings.
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s

binary_sensor:
  # Water dangerously close to the sensor: tank overfull / OVERFLOWING,
  # or the sensor has dropped onto something.
  #
  # *** READS RAW, NOT 'tank_distance'. *** A low quantile is inherently
  # immune to short excursions, so pointed at the filtered sensor this
  # could never fire again. delayed_on raised 30s -> 60s because fill
  # splash reads sub-0.15 m in bursts (504 samples over 5 days, all inside
  # fill hours); 60 s of CONTINUOUS sub-threshold is a real overflow.
  - platform: template
    name: "Water Tank Overflow Risk"
    device_class: problem
    lambda: |-
      if (isnan(id(tank_distance_raw).state)) return {};
      return id(tank_distance_raw).state < ${overflow_distance_m};
    filters:
      - delayed_on: 60s

  # Sensor reports no target (distance beyond the tank): knocked askew,
  # fallen off the tank, or water dropped below the sensing range.
  #
  # *** ALSO READS RAW. *** Same reason: the quantile filter discards the
  # 6.5 m no-target code entirely, so this check was dead against the
  # filtered sensor. Only 4 samples hit 6.5 m in 5 days, and delayed_on
  # requires 30 s continuous, so raw is safe here.
  - platform: template
    name: "Water Tank Sensor Fault"
    device_class: problem
    lambda: |-
      if (isnan(id(tank_distance_raw).state)) return {};
      return id(tank_distance_raw).state > ${no_target_distance_m};
    filters:
      - delayed_on: 30s

  # NEW — low water, off the UNGATED path so a genuine fast drain cannot be
  # hidden by the jump gate's hold. 15 min of continuous low reading.
  - platform: template
    name: "Water Tank Low"
    device_class: problem
    lambda: |-
      if (isnan(id(tank_distance_fast).state)) return {};
      return id(tank_distance_fast).state > ${low_water_distance_m};
    filters:
      - delayed_on: 15min

# M5 Atom Lite built-in RGB NeoPixel (GPIO27)
light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812
    pin: GPIO27
    num_leds: 1
    name: "Status LED"
    restore_mode: ALWAYS_OFF
    internal: true

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic
